name: 'Version Bump'
on:
  workflow_dispatch:
    inputs:
      workspace_input:
        description: 'Workspace (this must be a JSON array)'
        required: true
        type: string
      version-bump-type:
        description: 'Specifies the type of version update to apply.'
        required: true
        default: 'minor'
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-bump:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(inputs.workspace_input) }}

    name: ${{ matrix.workspace }} version:bump
    defaults:
      run:
        working-directory: workspaces/${{ matrix.workspace }}
    steps:
      - name: 'Checkout devportal-plugins'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: npm i -g corepack && corepack enable

      - name: yarn install --immutable
        run: yarn install --immutable

      - name: 'Set release name'
        id: set_release_name
        working-directory: .
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: node scripts/ci/set-release-name.js "$WORKSPACE"
      - name: 'Configure git'
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: 'Create workspace branch'
        env:
          WORKSPACE: ${{ matrix.workspace }}
          RELEASE_VERSION: ${{ steps.set_release_name.outputs.release_version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BRANCH_NAME="${WORKSPACE}/v${RELEASE_VERSION}"
          BRANCH=$(git branch --list "$BRANCH_NAME")
          if [ ! -z "$BRANCH" ]; then
              git branch -D "$BRANCH_NAME"
          fi
          git checkout -b "$BRANCH_NAME"
      - name: Run backstage-cli versions:bump --release ${{ steps.set_release_name.outputs.release_version }} command
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
          RELEASE_LINE: ${{ steps.set_release_name.outputs.release_version }}
        run: yarn backstage-cli versions:bump --release "$RELEASE_LINE"
      - name: Run dedupe
        run: yarn dedupe
      - name: 'Check for changes'
        id: check_for_changes
        run: |
          CHANGES=$(git status --porcelain)
          if [ -z "$CHANGES" ]; then
              echo "No changes"
              echo "HAS_CHANGES=0" >> $GITHUB_OUTPUT
          else
              echo "Has changes"
              echo "HAS_CHANGES=1" >> $GITHUB_OUTPUT
          fi
      - name: 'Add changeset'
        if: ${{ steps.check_for_changes.outputs.HAS_CHANGES == 1 }}
        env:
          RELEASE_VERSION: ${{ steps.set_release_name.outputs.release_version }}
          BUMP_TYPE: ${{ inputs.version-bump-type || 'minor' }}
        run: node ../../scripts/ci/generate-version-bump-changeset.js "$RELEASE_VERSION" "$BUMP_TYPE"
      - name: 'Commit changes'
        if: ${{ steps.check_for_changes.outputs.HAS_CHANGES == 1 }}
        env:
          WORKSPACE: ${{ matrix.workspace }}
          RELEASE_VERSION: ${{ steps.set_release_name.outputs.release_version }}
        run: |
          git status
          git add -A -- :!.npmrc
          git commit -m "v${RELEASE_VERSION} version bump"
          git push origin "${WORKSPACE}/v${RELEASE_VERSION}"
      - name: 'Create Pull Request'
        if: ${{ steps.check_for_changes.outputs.HAS_CHANGES == 1 }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.create({
              title: '${{ matrix.workspace }} - version:bump to v${{ steps.set_release_name.outputs.release_version }}',
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: '${{ matrix.workspace }}/v${{ steps.set_release_name.outputs.release_version }}',
              base: 'main',
              body: [
                'The DevPortal host Backstage version is v${{ steps.set_release_name.outputs.release_version }}, this Pull Request contains the changes to upgrade ${{ matrix.workspace }} to this release',
                ' ',
                'Please review the changelog before approving, there may be manual changes needed:',
                ' ',
                '- Changelog: [v${{ steps.set_release_name.outputs.release_version }}](https://github.com/backstage/backstage/blob/master/docs/releases/v${{ steps.set_release_name.outputs.release_version }}-changelog.md)',
                '- Upgrade Helper: [From ${{ steps.set_release_name.outputs.current_version }} to ${{ steps.set_release_name.outputs.release_version }}](https://backstage.github.io/upgrade-helper/?from=${{ steps.set_release_name.outputs.current_version }}&to=${{ steps.set_release_name.outputs.release_version }})',
                ' ',
                'Created by [Version Bump ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})',
                ' '
              ].join('\n')
            });
