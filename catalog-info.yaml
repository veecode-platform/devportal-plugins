apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: devportal-plugins
  description: VeeCode Backstage plugins monorepo, one workspace per plugin family. Plugins reach the fleet as OCI images through devportal-plugin-export-overlays, whose source.json pins each workspace by commit.
  annotations:
    github.com/project-slug: veecode-platform/devportal-plugins
  tags: [backstage, plugins]
spec:
  type: library
  lifecycle: production
  owner: group:default/veecode-platform
  system: veecode-devportal
  dependsOn:
    - component:default/devportal-plugin-export-overlays
