apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: devportal-plugins
  description: >-
    VeeCode DevPortal plugins monorepo. Each directory under workspaces/ is a self-contained
    Backstage app hosting related plugins, published to npm under @veecode-platform as static
    and dynamic packages. Published packages reach the DevPortal image as OCI dynamic-plugin
    artifacts through devportal-plugin-export-overlays. Inventory, status and roadmap live in
    devportal-plugins-parent.
  annotations:
    github.com/project-slug: veecode-platform/devportal-plugins
  tags: [backstage, plugins]
spec:
  type: library
  lifecycle: production
  owner: group:default/veecode-platform
  system: veecode-devportal
  dependsOn:
    - component:default/devportal-plugin-export-overlays
