plugins:
  - package: ./dynamic-plugins-src/{{dynamic_package}}
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          veecode-platform.backstage-plugin-{{name}}:
            dynamicRoutes:
              - path: /{{name}}
                importName: "{{pascalName}}Page"
                menuItem:
                  text: "{{pascalName}}"
                  enabled: true
