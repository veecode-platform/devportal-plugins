plugins:
  - package: ./dynamic-plugins/dist/devportal-marketplace-backend
    disabled: false
  - package: ./dynamic-plugins/dist/devportal-pending-changes-dynamic
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          devportal.pending-changes:
            mountPoints:
              - mountPoint: global.header/component
                importName: PendingChangesButton
                config:
                  priority: 55
                  props:
                    pollingIntervalMs: 30000
  - package: ./dynamic-plugins/dist/devportal-marketplace-frontend-dynamic
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          devportal.marketplace-frontend:
            appIcons:
              - name: pluginsIcon
                importName: PluginsIcon
            dynamicRoutes:
              - path: /marketplace
                importName: DynamicExtensionsPluginRouter
                menuItem:
                  icon: pluginsIcon
                  text: Marketplace
            menuItems:
              marketplace:
                title: Marketplace
                icon: pluginsIcon
