includes:
  - dynamic-plugins.default.yaml

plugins:
  # The module extends the kubernetes backend. The backend comes from the catalog
  # index, disabled there by default; this entry enables it. The export helper pins
  # the reference to the digest the index lists.
  - package: oci://quay.io/veecode/backstage-plugin-kubernetes-backend!backstage-plugin-kubernetes-backend
    disabled: false
    pluginConfig:
      kubernetes:
        serviceLocatorMethod:
          type: singleTenant
        clusterLocatorMethods:
          - type: config
            clusters:
              - name: local-cluster
                url: https://kubernetes.default.svc
                authProvider: serviceAccount
                skipTLSVerify: true
  - package: ./dynamic-plugins/dist/veecode-platform-plugin-kubernetes-backend-module-getsecret-dynamic
    disabled: false
    pluginConfig:
      catalog:
        locations:
          - type: file
            target: /opt/app-root/src/examples/entities.yaml
          - type: file
            target: /opt/app-root/src/examples/org.yaml
            rules:
              - allow: [User, Group]
          - type: file
            target: /opt/app-root/src/examples/clusters.yaml
            rules:
              - allow: [Resource]
      veecode:
        kubernetes:
          addDefaultKubernetesAuthStrategies: false
          fetchSecretWithRawHttps: false
