# Transitional compose; replaced by devportal-local in M8 stage 4
# (plugins ADR-0009, docs/adr/).
#
# Starts DevPortal with pretty logging:
#
# docker compose up --no-log-prefix
#

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: backstage, POSTGRES_PASSWORD: backstage, POSTGRES_DB: backstage }
  fix-volume-ownership:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1001:1001 /dynamic-plugins-root"]
    volumes:
      - dynamic-plugins-root:/dynamic-plugins-root
  install-dynamic-plugins:
    image: ${DEVPORTAL_IMAGE:-veecode/devportal@sha256:a72cf5cb47b87e5c5d62531b7ce554ee05ff7d09c23e74c5aee70c7a248d0941}
    depends_on:
      fix-volume-ownership: { condition: service_completed_successfully }
    entrypoint: ["./install-dynamic-plugins.sh"]
    command: ["/dynamic-plugins-root"]
    volumes:
      - dynamic-plugins-root:/dynamic-plugins-root
      - ./dynamic-plugins.yaml:/opt/app-root/src/dynamic-plugins.yaml:ro
      - ../plugins/kubernetes-backend-module-getsecret/dist-dynamic:/opt/app-root/src/dynamic-plugins/dist/veecode-platform-plugin-kubernetes-backend-module-getsecret-dynamic:ro
  devportal:
    image: ${DEVPORTAL_IMAGE:-veecode/devportal@sha256:a72cf5cb47b87e5c5d62531b7ce554ee05ff7d09c23e74c5aee70c7a248d0941}
    depends_on:
      install-dynamic-plugins: { condition: service_completed_successfully }
      postgres: { condition: service_started }
    ports: ["7007:7007", "9229:9229"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=backstage
      - POSTGRES_PASSWORD=backstage
      - DEVELOPMENT=true
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - DEBUG_PORT=9229
      # cloudflare tunnel URL
      - TUNNEL_URL
      # will use shell value
      - VEECODE_PROFILE=local
      # one cluster uses K8S_SA_TOKEN, the other fetches from secret
      - K8S_SA_TOKEN
      # both need this
      - K8S_CA_DATA
      # for fetching secrets
      # - KUBECONFIG=/opt/app-root/src/.kube/config
      # avoid tls errors due to self sogned certs
      # - NODE_TLS_REJECT_UNAUTHORIZED=0
      # Red Hat hardened image crypto compatibility
      # - OPENSSL_CONF=/etc/pki/tls/openssl.cnf
      # Test different crypto providers
      #- NODE_OPTIONS=--openssl-legacy-provider
    volumes:
      - dynamic-plugins-root:/opt/app-root/src/dynamic-plugins-root
      # your config will add/override the default image config
      - ./app-config.yaml:/opt/app-root/src/app-config.local.yaml:ro
      # examples folder
      - ./examples:/opt/app-root/src/examples:ro
      # mount kube conf (hack)
      #- ~/.kube/config:/opt/app-root/src/.kube/config:ro
      # kube config
      #- $HOME/.kube:/opt/app-root/src/.kube:ro
      # mount certs
      #- ./certs:/opt/certs:ro
      # mount proxy config
      - ./proxy-config.yaml:/opt/app-root/src/.kube/config:ro
      # - kubevol:/opt/app-root/src/.kube
    command:
      - --config
      - dynamic-plugins-root/app-config.dynamic-plugins.yaml
      - --config
      - app-config.local.yaml
    extra_hosts:
      - "kubernetes.default:host-gateway"


  # runs kubectl proxy in the container
  kubectl-cli:
    # image with kubectl
    image: alpine/kubectl:1.36.4
    entrypoint: ["/bin/sh", "-c"]
    # replaces "0.0.0.0" with "kubernetes.default"
    command:
      - |
        mkdir -p /root/.kube
        sed 's/server: https:\/\/0\.0\.0\.0:\([0-9]*\)/server: https:\/\/kubernetes.default:\1/' /opt/.kube/config | sed '/server: https:\/\/host.docker.internal:/a\    insecure-skip-tls-verify: false' > /root/.kube/config
        exec kubectl proxy -p 8001
    volumes:
      - $HOME/.kube:/opt/.kube:ro
    network_mode: service:devportal


  # socat:
  #   image: alpine/socat:latest
  #   # exposes host-gateway:9000 as 127.0.0.1:9000 using socat
  #   command:
  #     - TCP-LISTEN:9000,fork,reuseaddr
  #     - TCP:host.docker.internal:9000
