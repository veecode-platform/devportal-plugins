# Transitional compose; replaced by devportal-local in M8 stage 4
# (devportal-plugins-parent ADR-0009).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: backstage, POSTGRES_PASSWORD: backstage, POSTGRES_DB: backstage }
  fix-volume-ownership:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1001:1001 /dynamic-plugins-root"]
    volumes:
      - dynamic-plugins-root:/dynamic-plugins-root
  install-dynamic-plugins:
    image: ${DEVPORTAL_IMAGE:-veecode/devportal@sha256:a72cf5cb47b87e5c5d62531b7ce554ee05ff7d09c23e74c5aee70c7a248d0941}
    depends_on:
      fix-volume-ownership: { condition: service_completed_successfully }
    entrypoint: ["./install-dynamic-plugins.sh"]
    command: ["/dynamic-plugins-root"]
    volumes:
      - dynamic-plugins-root:/dynamic-plugins-root
      - ./dynamic-plugins.yaml:/opt/app-root/src/dynamic-plugins.yaml:ro
      - ./plugins/kong-service-manager-backend/dist-dynamic:/opt/app-root/src/dynamic-plugins/dist/veecode-platform-backstage-plugin-kong-service-manager-backend-dynamic:ro
      - ./plugins/kong-service-manager/dist-dynamic:/opt/app-root/src/dynamic-plugins/dist/veecode-platform-backstage-plugin-kong-service-manager-dynamic:ro
      - ./plugins/scaffolder-field-extensions-kong/dist-dynamic:/opt/app-root/src/dynamic-plugins/dist/veecode-platform-backstage-plugin-scaffolder-field-extensions-kong-dynamic:ro
  devportal:
    image: ${DEVPORTAL_IMAGE:-veecode/devportal@sha256:a72cf5cb47b87e5c5d62531b7ce554ee05ff7d09c23e74c5aee70c7a248d0941}
    depends_on:
      install-dynamic-plugins: { condition: service_completed_successfully }
      postgres: { condition: service_started }
    ports: ["7007:7007"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=backstage
      - POSTGRES_PASSWORD=backstage
      - DEVELOPMENT=true
      - LOG_LEVEL=info
    volumes:
      - dynamic-plugins-root:/opt/app-root/src/dynamic-plugins-root
      - ./app-config.dynamic.yaml:/opt/app-root/src/app-config.local.yaml:ro
      - ./examples:/opt/app-root/src/examples:ro
    command:
      - --config
      - dynamic-plugins-root/app-config.dynamic-plugins.yaml
      - --config
      - app-config.local.yaml
    extra_hosts:
      - "manager.localdomain:host-gateway"
volumes:
  dynamic-plugins-root: {}
