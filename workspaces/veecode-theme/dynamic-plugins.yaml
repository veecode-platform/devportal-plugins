plugins:
  - package: ./dynamic-plugins/dist/veecode-platform-plugin-veecode-theme-dynamic
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          veecode-platform.plugin-veecode-theme:
            themes:
              - id: light
                title: VeeCode Light
                variant: light
                importName: VeecodeLightThemeProvider
              - id: dark
                title: VeeCode Dark
                variant: dark
                importName: VeecodeDarkThemeProvider
