apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: sample-gitlab-component
  description: Example resource with the annotations the GitLab Pipelines plugins read.
  annotations:
    gitlab.com/project-slug: some-group/some-repo
    backstage.io/source-location: url:https://gitlab.example.com/some-group/some-repo
spec:
  type: repository
  lifecycle: experimental
  owner: user:development/guest
