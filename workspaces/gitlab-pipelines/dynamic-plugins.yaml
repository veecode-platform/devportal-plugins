includes:
  - dynamic-plugins.default.yaml

plugins:
  - package: ./dynamic-plugins/dist/veecode-platform-backstage-plugin-gitlab-pipelines-backend-dynamic
    disabled: false
    pluginConfig:
      catalog:
        locations:
          - type: file
            target: /opt/app-root/src/examples/entities.yaml
  - package: ./dynamic-plugins/dist/veecode-platform-backstage-plugin-gitlab-pipelines-dynamic
    disabled: false
    pluginConfig:
      dynamicPlugins:
        frontend:
          veecode-platform.backstage-plugin-gitlab-pipelines:
            mountPoints:
              - mountPoint: entity.page.ci/cards
                importName: GitlabPipelineList
                config:
                  layout: { gridColumn: "1 / -1" }
                  if: { allOf: [isGitlabAvailable] }
              - mountPoint: entity.page.overview/cards
                importName: GitlabJobs
                config:
                  layout: { gridColumnEnd: { lg: "span 4", md: "span 6", xs: "span 12" } }
                  if: { allOf: [isGitlabJobsAvailable] }
