app:
  title: AI Resources Dev
  baseUrl: http://localhost:3000

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  database:
    client: better-sqlite3
    connection: ":memory:"

auth:
  providers:
    guest: {}

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, AiResource]
  locations:
    - type: file
      target: ./fixtures/ai-resource.yaml
      rules:
        - allow: [AiResource]

permission:
  enabled: true
